name: Finamp+ APK

# Builds an installable Android APK of this fork ("Finamp+", installs next to the official
# Finamp) and publishes it as a GitHub release, so it can be downloaded from a phone.
on:
  workflow_dispatch:
  push:
    branches:
      - 'widget**'

permissions:
  contents: write

concurrency:
  group: finamp-plus-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Finamp+ APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/share/powershell
          df -h

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # The APK is signed with the runner's Android debug key. It is kept in this repository's private
      # Actions cache, so new builds install as updates over older ones (as long as the cache lives).
      - name: Signing key cache
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: finamp-plus-debug-keystore-v1

      - run: flutter pub get

      - name: Build APK
        env:
          FINAMP_PLUS_BUILD: 'true'
        run: |
          # integration_test is a dev dependency: make sure the release plugin registrant doesn't reference it
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} || {
            sed -i '/integration_test/d' android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
            flutter build apk --release --no-pub --split-per-abi --build-number=${{ github.run_number }}
          }
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/finamp-plus.apk

      - uses: actions/upload-artifact@v6
        with:
          name: finamp-plus-apk
          path: out/finamp-plus.apk
          compression-level: 0

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: finamp-plus-${{ github.run_number }}
          name: Finamp+ (build ${{ github.run_number }})
          body: |
            Download **finamp-plus.apk** below on your Android phone and open it to install.
            Built from ${{ github.sha }}.
          files: out/finamp-plus.apk
          make_latest: true
